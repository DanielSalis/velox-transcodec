[package]
name = "velox-transcode"
version = "0.1.0"
description = "Transcodificador nativo de vídeo em lote para Fedora e macOS"
edition = "2024"
rust-version = "1.95"

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
i-slint-backend-qt = { version = "=1.19.0", default-features = false }
qttypes = { version = "0.2.12", default-features = false }
rfd = { version = "=0.18.0", default-features = false, features = ["xdg-portal"] }
slint = { version = "=1.19.0", default-features = false, features = ["std", "compat-1-18", "backend-qt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "=1.54.1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = { version = "=4.19.0", default-features = false, features = ["z-with-tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
notify-rust = { version = "=4.19.0", default-features = false, features = ["preview-macos-un"] }

[build-dependencies]
cc = "1.2"
slint-build = { version = "=1.19.0", default-features = false, features = ["compat-1-18"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
